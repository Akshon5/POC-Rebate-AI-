@if (auth.isLoggedIn()) {
  <div class="app-layout">
    <aside class="sidebar">

      <!-- Brand -->
      <div class="sidebar-brand">
        <span class="brand-icon">SCP</span>
        <div class="brand-text">
          <h1>RebateIQ</h1>
          <p>Finance Intelligence</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="sidebar-nav">
        @if (auth.isAdmin()) {
          <a routerLink="/upload-review" routerLinkActive="active" class="nav-item">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Upload & Review
          </a>
        }

        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          Dashboard
        </a>

        @if (auth.isAdmin()) {
          <a routerLink="/validate" routerLinkActive="active" class="nav-item">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Submissions
          </a>
        }
      </nav>

      <!-- Footer -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="info">
            <div class="username">{{ auth.currentUser()?.username }}</div>
            <div class="role">{{ auth.currentUser()?.role }}</div>
          </div>
        </div>
        <button (click)="logout()" class="logout-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </div>

    </aside>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}
